<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusBite - Stall Menu</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="screen-container home-layout">

        <!-- Top Navigation Bar -->
        <header class="top-nav">
            <button type="button" class="nav-btn back-btn" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="nav-actions">
                <button class="pill-btn" onclick="location.href='home.html'">Home</button>
                <button class="pill-btn active">Stalls</button>
            </div>
        </header>

        <!-- Stall Menu Main View -->
        <main class="content-view stall-menu-container">

            <!-- Stall Banner / Header -->
            <div class="stall-banner">
                <span class="banner-placeholder" id="banner-placeholder">
                    Stall Logo
                </span>

                <img id="stall-logo"
                    src=""
                    alt="Stall Logo"
                    class="stall-logo"
                    style="display: none;">
            </div>

            <h2 id="stall-name">Loading stall...</h2>

            <!-- Sub-category Filters -->
            <div class="sub-category-filters">
                <button class="sub-pill active" data-category="all">Popular</button>
                <button class="sub-pill" data-category="food">Food</button>
                <button class="sub-pill" data-category="drink">Drink</button>
            </div>

            <!-- Stall Menu Grid Items -->
            <div class="food-grid" id="menu-container">
                <p>Loading menu...</p>
            </div>

        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <button type="button" class="nav-item" onclick="location.href='profile.html'">
                <i class="fa-regular fa-user"></i>
                <span>Profile</span>
            </button>

            <button type="button" class="nav-item" onclick="location.href='favorite.html'">
                <i class="fa-regular fa-heart"></i>
                <span>Favorites</span>
            </button>

            <button type="button" class="nav-item" onclick="location.href='track.html'">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Track</span>
            </button>

            <button type="button" class="nav-item" onclick="location.href='order.html'">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Order</span>
            </button>
        </nav>
    </div>

    <script src="cordova.js"></script>
    <script src="js/stall-menu.js"></script>
</body>
</html>
