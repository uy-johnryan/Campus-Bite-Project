<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CampusBite - Checkout</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="screen-container checkout-layout">

        <!-- Top Navigation Bar -->
        <header class="top-nav-checkout">
            <button type="button" class="nav-btn close-btn" onclick="location.href='home.html'">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h1 class="page-title">Checkout</h1>
        </header>

        <!-- Checkout Content -->
        <main class="checkout-content">

            <!-- Payment Method Card -->
            <div class="checkout-card payment-card">
                <h3 class="card-section-title">Payment</h3>

                <div class="payment-options">

                    <div class="payment-option selected" data-payment="cash">
                        <span class="payment-label">Cash</span>
                        <div class="payment-box">
                            <i class="fa-solid fa-money-bill-wave cash-icon"></i>
                        </div>
                    </div>

                    <div class="payment-option" data-payment="gcash">
                        <span class="payment-label">GCash</span>
                        <div class="payment-box">
                            <span class="gcash-logo">G</span>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Your Order Card -->
            <div class="checkout-card order-summary-card">
                <h3 class="card-section-title">Your Order</h3>

                <div id="checkout-items">
                    <p>Loading your order...</p>
                </div>

                <div class="order-totals" id="checkout-totals">
                    <!-- Totals will be displayed here -->
                </div>
            </div>

        </main>

        <!-- Bottom Footer -->
        <div class="checkout-bottom-footer">

            <div class="footer-info-row">
                <span class="products-count" id="products-count">0 Products</span>
                <span class="footer-total" id="footer-total">Total: P 0.00</span>
            </div>

            <button type="button" class="send-order-btn" id="send-order-btn">
                Send Order
            </button>

        </div>

    </div>

    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
