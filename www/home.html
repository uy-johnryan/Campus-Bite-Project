<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CampusBite - Home</title>
    <link rel="stylesheet" href="css/index.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="screen-container">
        <!-- Top Navigation Bar -->
        <header class="top-nav">
            <button type="button" class="nav-btn back-btn" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="nav-actions">
                <!-- Home Button (Active State) -->
                <button class="pill-btn active">Home</button>
                <!-- Stalls Button -->
                <button class="pill-btn" onclick="location.href='stall-menu.html'">Stalls</button>
            </div>
        </header>   

        <!-- Food Grid -->
        <main class="food-grid">
            <!-- Card 1 -->
            <div class="food-card green">
                <div class="image-wrapper">
                    <img src="https://via.placeholder.com/150" alt="Chicken Pops">
                    <button class="favorite-btn"><i class="fa-regular fa-heart"></i></button>
                </div>
                <div class="card-details">
                    <div class="text-info">
                        <h3>Chicken Pops</h3>
                        <p class="price">P 85</p>
                    </div>
                    <div class="rating">
                        <i class="fa-solid fa-star"></i> <span>4.5</span>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="food-card green">
                <div class="image-wrapper">
                    <img src="https://via.placeholder.com/150" alt="Beef Shawarma">
                    <button class="favorite-btn"><i class="fa-regular fa-heart"></i></button>
                </div>
                <div class="card-details">
                    <div class="text-info">
                        <h3>Beef Shawarma</h3>
                        <p class="price">P 85</p>
                    </div>
                    <div class="rating">
                        <i class="fa-solid fa-star"></i> <span>3.9</span>
                    </div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="food-card pink">
                <div class="image-wrapper">
                    <img src="https://via.placeholder.com/150" alt="Shawarma Rice">
                    <button class="favorite-btn"><i class="fa-regular fa-heart"></i></button>
                </div>
                <div class="card-details">
                    <div class="text-info">
                        <h3>Shawarma Rice</h3>
                        <p class="price">P 90</p>
                    </div>
                    <div class="rating">
                        <i class="fa-solid fa-star"></i> <span>4.5</span>
                    </div>
                </div>
            </div>

            <!-- Card 4 -->
            <div class="food-card green">
                <div class="image-wrapper">
                    <img src="https://via.placeholder.com/150" alt="Jumbo Fries">
                    <button class="favorite-btn"><i class="fa-regular fa-heart"></i></button>
                </div>
                <div class="card-details">
                    <div class="text-info">
                        <h3>Jumbo Fries</h3>
                        <p class="price">P 75</p>
                    </div>
                    <div class="rating">
                        <i class="fa-solid fa-star"></i> <span>4.3</span>
                    </div>
                </div>
            </div>

            <!-- Card 5 -->
            <div class="food-card green">
                <div class="image-wrapper">
                    <img src="https://via.placeholder.com/150" alt="Small Ice Tea">
                    <button class="favorite-btn"><i class="fa-regular fa-heart"></i></button>
                </div>
                <div class="card-details">
                    <div class="text-info">
                        <h3>Small Ice Tea</h3>
                        <p class="price">P 15</p>
                    </div>
                    <div class="rating">
                        <i class="fa-solid fa-star"></i> <span>4.2</span>
                    </div>
                </div>
            </div>

            <!-- Card 6 -->
            <div class="food-card green">
                <div class="image-wrapper">
                    <img src="https://via.placeholder.com/150" alt="Pork Sisig Rice Bowl">
                    <button class="favorite-btn"><i class="fa-regular fa-heart"></i></button>
                </div>
                <div class="card-details">
                    <div class="text-info">
                        <h3>Pork Sisig Rice Bowl</h3>
                        <p class="price">P 90</p>
                    </div>
                    <div class="rating">
                        <i class="fa-solid fa-star"></i> <span>4.1</span>
                    </div>
                </div>
            </div>

            <!-- Card 7 -->
            <div class="food-card green">
                <div class="image-wrapper">
                    <img src="https://via.placeholder.com/150" alt="Hungarian Sausage">
                    <button class="favorite-btn"><i class="fa-regular fa-heart"></i></button>
                </div>
                <div class="card-details">
                    <div class="text-info">
                        <h3>Hungarian Sausage</h3>
                        <p class="price">P 90</p>
                    </div>
                    <div class="rating">
                        <i class="fa-solid fa-star"></i> <span>4.5</span>
                    </div>
                </div>
            </div>

            <!-- Card 8 -->
            <div class="food-card pink">
                <div class="image-wrapper">
                    <img src="https://via.placeholder.com/150" alt="BBQ Chicken Rice Bowl">
                    <button class="favorite-btn"><i class="fa-regular fa-heart"></i></button>
                </div>
                <div class="card-details">
                    <div class="text-info">
                        <h3>BBQ Chicken Rice Bowl</h3>
                        <p class="price">P 85</p>
                    </div>
                    <div class="rating">
                        <i class="fa-solid fa-star"></i> <span>4.2</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <button type="button" class="nav-item">
                <i class="fa-regular fa-user"></i>
                <span>Profile</span>
            </button>
            <button type="button" class="nav-item">
                <i class="fa-regular fa-heart"></i>
                <span>Favorites</span>
            </button>
            <button type="button" class="nav-item" onclick="location.href='track.html'">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Track</span>
            </button>
            <button type="button" class="nav-item" onclick="location.href='order.html'">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Order</span>
            </button>
        </nav>
    </div>
    <script src ="cordova.js"></script>
    <script src ="js/index.js"></script>
</body>
</html>
