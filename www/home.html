
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CampusBite - Home</title>
    <link rel="stylesheet" href="css/index.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="screen-container">

        <!-- Top Navigation Bar -->
        <header class="top-nav">
            <button type="button" class="nav-btn back-btn" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>

            <div class="nav-actions">
                <button class="pill-btn active">Home</button>
                <button class="pill-btn" onclick="location.href='stalls.html'">Stalls</button>
            </div>
        </header>

        <!-- Food Grid -->
        <main class="food-grid" id="home-food-grid">

            <!-- Small Ice Tea -->
            <div class="food-card green" data-item-id="1">
                <div class="image-wrapper">
                    <img src="https://via.placeholder.com/150" alt="Small Ice Tea">
                    <button type="button" class="favorite-btn">
                        <i class="fa-regular fa-heart"></i>
                    </button>
                </div>

                <div class="card-details">
                    <div class="text-info">
                        <h3>Small Ice Tea</h3>
                        <p class="price">P 15</p>
                    </div>

                    <div class="rating">
                        <i class="fa-solid fa-star"></i>
                        <span>4.2</span>
                    </div>
                </div>
            </div>

            <!-- Chicken Pops -->
            <div class="food-card green" data-item-id="2">
                <div class="image-wrapper">
                    <img src="https://via.placeholder.com/150" alt="Chicken Pops">
                    <button type="button" class="favorite-btn">
                        <i class="fa-regular fa-heart"></i>
                    </button>
                </div>

                <div class="card-details">
                    <div class="text-info">
                        <h3>Chicken Pops</h3>
                        <p class="price">P 85</p>
                    </div>

                    <div class="rating">
                        <i class="fa-solid fa-star"></i>
                        <span>4.5</span>
                    </div>
                </div>
            </div>

            <!-- Chicken Skin -->
            <div class="food-card green" data-item-id="3">
                <div class="image-wrapper">
                    <img src="https://via.placeholder.com/150" alt="Chicken Skin">
                    <button type="button" class="favorite-btn">
                        <i class="fa-regular fa-heart"></i>
                    </button>
                </div>

                <div class="card-details">
                    <div class="text-info">
                        <h3>Chicken Skin</h3>
                        <p class="price">P 0.00</p>
                    </div>

                    <div class="rating">
                        <i class="fa-solid fa-star"></i>
                        <span>0.0</span>
                    </div>
                </div>
            </div>

            <!-- BBQ Chicken Rice Bowl -->
            <div class="food-card green" data-item-id="4">
                <div class="image-wrapper">
                    <img src="https://via.placeholder.com/150" alt="BBQ Chicken Rice Bowl">
                    <button type="button" class="favorite-btn">
                        <i class="fa-regular fa-heart"></i>
                    </button>
                </div>

                <div class="card-details">
                    <div class="text-info">
                        <h3>BBQ Chicken Rice Bowl</h3>
                        <p class="price">P 85</p>
                    </div>

                    <div class="rating">
                        <i class="fa-solid fa-star"></i>
                        <span>4.2</span>
                    </div>
                </div>
            </div>

        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">

            <button type="button" class="nav-item" onclick="location.href='profile.html'">
                <i class="fa-regular fa-user"></i>
                <span>Profile</span>
            </button>

            <button type="button" class="nav-item" onclick="location.href='favorite.html'">
                <i class="fa-regular fa-heart"></i>
                <span>Favorites</span>
            </button>

            <button type="button" class="nav-item" onclick="location.href='track.html'">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Track</span>
            </button>

            <button type="button" class="nav-item" onclick="location.href='order.html'">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Order</span>
            </button>

        </nav>

    </div>

    <script src="cordova.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
