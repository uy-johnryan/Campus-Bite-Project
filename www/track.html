<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CampusBite - My Orders</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="screen-container track-layout">

        <!-- Top Navigation -->
        <header class="top-nav-track">
            <button type="button" class="nav-btn back-btn" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1 class="page-title">My Orders</h1>
            <span></span>
        </header>

        <!-- Orders List -->
        <main class="track-content">

            <section class="track-section">
                <h2 class="section-title">Your Orders</h2>

                <div id="orders-container">
                    <p class="orders-message">Loading your orders...</p>
                </div>
            </section>

        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button type="button" class="nav-item" onclick="location.href='profile.html'">
                <i class="fa-regular fa-user"></i>
                <span>Profile</span>
            </button>

            <button type="button" class="nav-item" onclick="location.href='favorite.html'">
                <i class="fa-regular fa-heart"></i>
                <span>Favorites</span>
            </button>

            <button type="button" class="nav-item active" onclick="location.href='track.html'">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Track</span>
            </button>

            <button type="button" class="nav-item" onclick="location.href='order.html'">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Order</span>
            </button>
        </nav>

    </div>

    <script src="cordova.js"></script>
    <script src="js/track.js"></script>
</body>
</html>
