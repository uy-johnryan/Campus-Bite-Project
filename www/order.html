
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CampusBite - Order</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="screen-container order-layout">

        <!-- Top Navigation Bar -->
        <header class="top-nav-order">
            <button type="button" class="nav-btn back-btn" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1 class="page-title">Order</h1>
        </header>

        <!-- Dynamic Orders List -->
        <main class="order-content" id="order-container">
            <p>Loading your orders...</p>
        </main>

        <!-- Fixed Bottom Checkout Section -->
        <div class="checkout-footer">
            <button type="button" class="checkout-btn" id="checkout-btn">
                <span>Checkout</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

    </div>

    <script src="cordova.js"></script>
    <script src="js/order.js"></script>
</body>
</html>
