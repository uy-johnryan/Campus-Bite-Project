<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CampusBite - Favorites</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="screen-container">

        <!-- Top Navigation -->
        <header class="page-header">
            <button type="button" class="nav-btn back-btn" onclick="location.href='home.html'">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2>My Favorites</h2>
        </header>

        <!-- Favorites Content -->
        <main class="favorite-content" id="favorite-content">
            <p class="favorites-loading">Loading your favorites...</p>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <button type="button" class="nav-item" onclick="location.href='profile.html'">
                <i class="fa-regular fa-user"></i>
                <span>Profile</span>
            </button>

            <button type="button" class="nav-item" onclick="location.href='favorite.html'">
                <i class="fa-regular fa-heart"></i>
                <span>Favorites</span>
            </button>

            <button type="button" class="nav-item" onclick="location.href='track.html'">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Track</span>
            </button>

            <button type="button" class="nav-item" onclick="location.href='order.html'">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Order</span>
            </button>
        </nav>
    </div>

    <script src="cordova.js"></script>
    <script src="js/favorite.js"></script>
</body>
</html>
