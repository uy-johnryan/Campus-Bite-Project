<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CampusBite - Vendor Dashboard</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="screen-container vendor-layout">
    
        <!-- Top Filter Controls -->
        <header class="vendor-header">

            <div class="vendor-menu-wrapper">
                <button type="button" class="nav-btn menu-btn" id="menu-btn">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div class="vendor-dropdown" id="vendor-dropdown">
                    <button type="button" id="logout-btn">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </button>
                </div>
            </div>

            <div class="filter-pills-grid">
                <button class="filter-pill active" data-filter="all">
                    All (0)
                </button>

                <button class="filter-pill" data-filter="pending">
                    Incoming Orders (0)
                </button>

                <button class="filter-pill" data-filter="ready">
                    Ready (0)
                </button>

                <button class="filter-pill" data-filter="in-progress">
                    In Progress (0)
                </button>

                <button class="filter-pill" data-filter="no_show">
                    No Show (0)
                </button>

                <button class="filter-pill" data-filter="completed">
                    Completed (0)
                </button>
            </div>

        </header>

        <!-- Orders Stream Container -->
        <main class="vendor-orders-list" id="vendor-orders-list">
            <p class="vendor-message">Loading orders...</p>
        </main>

    </div>
    <script src ="cordova.js"></script>
    <script src ="js/index.js"></script>
    <script src="js/vendor-dashboard.js"></script>
</body>
</html>
